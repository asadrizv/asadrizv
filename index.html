<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fav</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Fav</h1>
    <p class="tagline">Your favorite moments</p>
  </header>

  <div id="upload-area">
    <label for="file-input" id="upload-label">
      <span class="upload-icon">+</span>
      <span>Add Photos</span>
    </label>
    <input type="file" id="file-input" accept="image/*" multiple hidden>
  </div>

  <main id="feed"></main>

  <div id="viewer" class="hidden">
    <button id="viewer-close">&times;</button>
    <div id="viewer-scroll">
      <!-- Full-screen photos injected here -->
    </div>
  </div>

  <div id="empty-state">
    <p>No memories yet</p>
    <p class="sub">Tap <strong>+</strong> to add your favorite photos</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
