<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a6b54" />
    <title>Sahil — Book Pakistan's best businesses</title>
    <meta
      name="description"
      content="Sahil is Pakistan's all-in-one platform to book salons, barbers, spas, clinics, fitness, tutors and more."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 22c4-3 6-3 10 0s6 3 10 0 6-3 10 0" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle cx="24" cy="10" r="3.2" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-text">Sahil<span class="brand-dot">.</span><span class="brand-pk">pk</span></span>
      </a>
      <nav class="topnav">
        <a href="#/" data-route="/">Discover</a>
        <a href="#/bookings" data-route="/bookings">My bookings</a>
        <button class="btn btn-ghost" id="auth-btn">Sign in</button>
      </nav>
    </header>

    <main id="app"></main>

    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <strong>Sahil</strong>
          <span>Pakistan's all-in-one booking platform.</span>
        </div>
        <div class="footer-meta">
          <span>Karachi · Lahore · Islamabad</span>
          <span>© 2026 Sahil PK</span>
        </div>
      </div>
    </footer>

    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
